<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가계부 약관</title>
<style>
  :root { --bg: #F2F1F7; --surface: #FFFFFF; --ink: #262C27; --muted: #6E6E78; }
  @media (prefers-color-scheme: dark) { :root { --bg: #131316; --surface: #1C1D20; --ink: #ECEDEA; --muted: #A1A1AA; color-scheme: dark; } }
  body { background: var(--bg); color: var(--ink); font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; margin: 0; padding: 48px 16px; }
  main { max-width: 480px; margin: 0 auto; display: grid; gap: 12px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  a { display: block; background: var(--surface); color: var(--ink); text-decoration: none; padding: 16px 18px; border-radius: 14px; font-weight: 600; }
  a:focus-visible { outline: 2px solid var(--ink); }
</style>
</head>
<body>
<main>
  <h1>가계부</h1>
  <a href="terms.html">이용약관</a>
  <a href="privacy.html">개인정보처리방침</a>
</main>
</body>
</html>
